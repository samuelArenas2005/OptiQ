<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OptiQ - Quantum Pipeline Visualizer (End-to-End BIP → PINN → QAOA)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-primary: #060913;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Outfit', sans-serif;
    }
    body { background: var(--bg-primary); color: #fff; font-family: var(--font-sans); overflow: hidden; margin: 0; padding: 0; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body class="w-screen h-screen flex flex-col bg-[#060913] select-none">
  <!-- Header -->
  <header class="px-6 py-3.5 bg-slate-900/90 border-b border-cyan-500/20 flex items-center justify-between gap-4 shrink-0">
    <div class="flex items-center gap-3">
      <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#00f2fe]"></span>
      <h1 class="font-mono text-base font-bold text-white tracking-wide">
        OptiQ <span class="text-cyan-400">Quantum Pipeline Visualizer</span>
      </h1>
      <span class="font-mono text-[10px] bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 px-2.5 py-0.5 rounded-full">
        BIP MiniZinc → QUBO → PINN → QAOA Ansatz
      </span>
    </div>

    <!-- Stepper de Etapas -->
    <div class="flex items-center gap-1.5 bg-black/60 p-1 rounded-xl border border-white/10 text-xs font-mono">
      <button onclick="goToStage(0)" class="stage-btn px-2.5 py-1 rounded-lg transition-all" data-stage="0">1. Parser</button>
      <button onclick="goToStage(1)" class="stage-btn px-2.5 py-1 rounded-lg transition-all" data-stage="1">2. Grafo QUBO</button>
      <button onclick="goToStage(2)" class="stage-btn px-2.5 py-1 rounded-lg transition-all" data-stage="2">3. Features</button>
      <button onclick="goToStage(3)" class="stage-btn px-2.5 py-1 rounded-lg transition-all" data-stage="3">4. Red PINN</button>
      <button onclick="goToStage(4)" class="stage-btn px-2.5 py-1 rounded-lg transition-all" data-stage="4">5. Composer</button>
      <button onclick="goToStage(5)" class="stage-btn px-2.5 py-1 rounded-lg transition-all" data-stage="5">6. Shots 3D</button>
    </div>
  </header>

  <!-- Stage Viewport -->
  <main id="stage-viewport" class="flex-1 w-full min-h-0 relative p-4 overflow-hidden"></main>

  <!-- Footer Controls -->
  <footer class="px-6 py-2.5 bg-slate-900/90 border-t border-cyan-500/20 flex items-center justify-between shrink-0 font-mono text-xs">
    <div class="flex items-center gap-2">
      <button id="btn-prev" class="px-3 py-1 bg-white/5 hover:bg-cyan-500/20 border border-white/10 rounded-lg text-white">⏮ Anterior</button>
      <button id="btn-toggle" class="px-3.5 py-1 bg-gradient-to-r from-sky-600 to-blue-700 border border-cyan-400 text-white rounded-lg font-semibold shadow-md">⏸ Pausar</button>
      <button id="btn-next" class="px-3 py-1 bg-white/5 hover:bg-cyan-500/20 border border-white/10 rounded-lg text-white">Siguiente ⏭</button>
      <button id="btn-restart" class="p-1.5 bg-white/5 hover:bg-cyan-500/20 border border-white/10 rounded-lg text-cyan-300">🔄</button>
    </div>

    <div id="stage-info" class="text-slate-300">
      ETAPA: <span class="text-cyan-400 font-bold">1 / 6</span>
    </div>

    <div class="flex items-center gap-3">
      <div class="flex bg-black/40 rounded-lg p-0.5 border border-white/10">
        <button class="speed-btn px-2 py-0.5 rounded" data-speed="0.5">0.5x</button>
        <button class="speed-btn px-2 py-0.5 rounded bg-cyan-500/30 text-cyan-300" data-speed="1.0">1.0x</button>
        <button class="speed-btn px-2 py-0.5 rounded" data-speed="2.0">2.0x</button>
      </div>
    </div>
  </footer>

  <script type="module">
    import * as THREE from 'three';

    let currentStage = 0;
    let isPlaying = true;
    let speed = 1.0;
    const totalStages = 6;

    const stageViewport = document.getElementById('stage-viewport');
    const stageInfo = document.getElementById('stage-info');
    const btnToggle = document.getElementById('btn-toggle');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnRestart = document.getElementById('btn-restart');
    const stageBtns = document.querySelectorAll('.stage-btn');
    const speedBtns = document.querySelectorAll('.speed-btn');

    const stageNames = [
      "1. Parser MiniZinc",
      "2. Grafo & Formulación QUBO",
      "3. Extracción de Features Espectrales",
      "4. Red Neuronal PINN (Feed-Forward)",
      "5. Construcción Progresiva QAOA Composer",
      "6. Animación 3D de Barras Cuánticas (1024 Shots)"
    ];

    window.goToStage = function(idx) {
      currentStage = idx;
      renderStage();
    };

    function renderStage() {
      stageBtns.forEach((btn, i) => {
        btn.classList.toggle('bg-cyan-500', i === currentStage);
        btn.classList.toggle('text-slate-950', i === currentStage);
        btn.classList.toggle('font-bold', i === currentStage);
        btn.classList.toggle('text-slate-400', i !== currentStage);
      });

      stageInfo.innerHTML = `ETAPA: <span class="text-cyan-400 font-bold">${currentStage + 1} / ${totalStages}</span> — <span class="text-white font-semibold">${stageNames[currentStage]}</span>`;

      if (currentStage === 0) renderStage1();
      else if (currentStage === 1) renderStage2();
      else if (currentStage === 2) renderStage3();
      else if (currentStage === 3) renderStage4();
      else if (currentStage === 4) renderStage5();
      else if (currentStage === 5) renderStage6();
    }

    // Etapa 1: Parser
    function renderStage1() {
      stageViewport.innerHTML = `
        <div class="w-full h-full flex flex-col md:flex-row gap-4">
          <div class="flex-1 bg-[#070b16] rounded-2xl border border-cyan-500/30 p-4 font-mono text-xs overflow-hidden flex flex-col">
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-cyan-500/20 text-cyan-300 font-bold">
              <span>Escaneo Línea por Línea del Código MiniZinc</span>
              <span class="text-slate-400 text-[10px]">Dominio: BIP</span>
            </div>
            <div class="flex-1 space-y-1.5 text-slate-300 leading-relaxed py-2">
              <div class="text-emerald-400/80">% Problema de Programación Entera Binaria</div>
              <div class="text-cyan-300 bg-cyan-950/40 p-1.5 rounded">var bool: x1;  <span class="text-slate-400">// Qubit q0 (Costo +5)</span></div>
              <div class="text-cyan-300 bg-cyan-950/40 p-1.5 rounded">var bool: x2;  <span class="text-slate-400">// Qubit q1 (Costo +4)</span></div>
              <div class="text-cyan-300 bg-cyan-950/40 p-1.5 rounded">var bool: x3;  <span class="text-slate-400">// Qubit q2 (Costo +7)</span></div>
              <div class="text-cyan-300 bg-cyan-950/40 p-1.5 rounded">var bool: x4;  <span class="text-slate-400">// Qubit q3 (Costo +3)</span></div>
              <div class="text-amber-300 bg-amber-950/40 p-1.5 rounded mt-2">constraint 2*x1 + 3*x2 + 4*x3 + 2*x4 &lt;= 6;</div>
              <div class="text-amber-300 bg-amber-950/40 p-1.5 rounded">constraint x1 + x3 &lt;= 1;</div>
              <div class="text-purple-300 bg-purple-950/40 p-1.5 rounded font-bold mt-2">solve maximize 5*x1 + 4*x2 + 7*x3 + 3*x4;</div>
            </div>
          </div>
          <div class="w-full md:w-96 flex flex-col gap-3 font-mono text-xs">
            <div class="bg-[#070b16] rounded-2xl border border-emerald-500/30 p-4">
              <div class="text-emerald-300 font-bold mb-2">Variables Cuánticas Asignadas</div>
              <div class="grid grid-cols-2 gap-2 text-slate-300">
                <div class="p-2 bg-emerald-950/30 border border-emerald-500/30 rounded">x1 → q0 (w=5)</div>
                <div class="p-2 bg-emerald-950/30 border border-emerald-500/30 rounded">x2 → q1 (w=4)</div>
                <div class="p-2 bg-emerald-950/30 border border-emerald-500/30 rounded">x3 → q2 (w=7)</div>
                <div class="p-2 bg-emerald-950/30 border border-emerald-500/30 rounded">x4 → q3 (w=3)</div>
              </div>
            </div>
            <div class="bg-[#070b16] rounded-2xl border border-amber-500/30 p-4">
              <div class="text-amber-300 font-bold mb-1">Restricciones a Penalización QUBO</div>
              <div class="text-slate-300 text-[11px] leading-relaxed">
                • C1: 2x1 + 3x2 + 4x3 + 2x4 ≤ 6 (Capacidad)<br>
                • C2: x1 + x3 ≤ 1 (Exclusión Mutua Antiferromagnética)
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Etapa 2: Grafo y QUBO
    function renderStage2() {
      stageViewport.innerHTML = `
        <div class="w-full h-full flex flex-col md:flex-row gap-4">
          <div id="three-container" class="flex-1 bg-[#070b16] rounded-2xl border border-cyan-500/30 min-h-[300px]"></div>
          <div class="w-full md:w-96 flex flex-col gap-3 font-mono text-xs">
            <div class="bg-[#070b16] rounded-2xl border border-cyan-500/30 p-4">
              <div class="text-cyan-300 font-bold mb-1">Hamiltoniano de Costo H_C (Ising)</div>
              <div class="p-2 bg-black/60 rounded border border-cyan-500/30 text-center text-white font-bold my-2">
                H_C = ∑ hᵢ Zᵢ + ∑ Jᵢⱼ Zᵢ Zⱼ + C
              </div>
              <div class="text-[10px] text-slate-400">Transformación exacta mediante penalización cuadrática λ = 8.5</div>
            </div>
            <div class="bg-[#070b16] rounded-2xl border border-emerald-500/30 p-4 flex-1">
              <div class="text-emerald-300 font-bold mb-2">Matriz QUBO Q (4x4)</div>
              <div class="grid grid-cols-4 gap-1.5 text-center text-[11px]">
                <div class="p-1.5 bg-purple-950/60 border border-purple-500/40 rounded text-purple-200 font-bold">-3.20</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+3.50</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+4.80</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+1.60</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+3.50</div>
                <div class="p-1.5 bg-purple-950/60 border border-purple-500/40 rounded text-purple-200 font-bold">-1.85</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+2.90</div>
                <div class="p-1.5 bg-slate-900 border border-white/5 rounded text-slate-600">0.00</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+4.80</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+2.90</div>
                <div class="p-1.5 bg-purple-950/60 border border-purple-500/40 rounded text-purple-200 font-bold">-4.10</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+2.40</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+1.60</div>
                <div class="p-1.5 bg-slate-900 border border-white/5 rounded text-slate-600">0.00</div>
                <div class="p-1.5 bg-cyan-950/40 border border-cyan-500/30 rounded text-cyan-200">+2.40</div>
                <div class="p-1.5 bg-purple-950/60 border border-purple-500/40 rounded text-purple-200 font-bold">-1.45</div>
              </div>
            </div>
          </div>
        </div>
      `;

      const container = document.getElementById('three-container');
      if (container) {
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0, 7.5);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        const coords = [
          { x: -1.8, y: 1.2, c: 0x38bdf8 },
          { x: 1.8, y: 1.2, c: 0x00ff88 },
          { x: 1.5, y: -1.4, c: 0xa855f7 },
          { x: -1.5, y: -1.4, c: 0xffea00 }
        ];

        coords.forEach(p => {
          const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 24), new THREE.MeshBasicMaterial({ color: p.c }));
          sphere.position.set(p.x, p.y, 0);
          group.add(sphere);
        });

        [[0,1],[0,2],[1,2],[2,3],[0,3]].forEach(([u,v]) => {
          const mat = new THREE.LineBasicMaterial({ color: 0x00f2fe, linewidth: 2 });
          const geo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(coords[u].x, coords[u].y, 0),
            new THREE.Vector3(coords[v].x, coords[v].y, 0)
          ]);
          group.add(new THREE.Line(geo, mat));
        });

        function animThree() {
          if (document.getElementById('three-container')) {
            requestAnimationFrame(animThree);
            group.rotation.y += 0.01;
            renderer.render(scene, camera);
          }
        }
        animThree();
      }
    }

    // Etapa 3: Features
    function renderStage3() {
      stageViewport.innerHTML = `
        <div class="w-full h-full flex flex-col gap-4 font-mono">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
            <div class="bg-[#070b16] rounded-2xl border border-cyan-500/30 p-4">
              <div class="text-2xl font-bold text-cyan-300">83.3%</div>
              <div class="text-xs text-slate-400 mt-1">Densidad Grafo (ρ)</div>
            </div>
            <div class="bg-[#070b16] rounded-2xl border border-emerald-500/30 p-4">
              <div class="text-2xl font-bold text-emerald-300">1.4382</div>
              <div class="text-xs text-slate-400 mt-1">Gap Espectral (λ₂)</div>
            </div>
            <div class="bg-[#070b16] rounded-2xl border border-purple-500/30 p-4">
              <div class="text-2xl font-bold text-purple-300">4.8210</div>
              <div class="text-xs text-slate-400 mt-1">Radio Espectral (λ_max)</div>
            </div>
            <div class="bg-[#070b16] rounded-2xl border border-amber-500/30 p-4">
              <div class="text-2xl font-bold text-amber-300">24.8%</div>
              <div class="text-xs text-slate-400 mt-1">Frustración (χ)</div>
            </div>
          </div>
          <div class="bg-[#070b16] rounded-2xl border border-cyan-500/30 p-4 flex-1">
            <div class="text-cyan-300 font-bold text-xs mb-3">Vector de Entrada Invariante para la Red PINN:</div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
              <div class="p-2 bg-slate-900/60 rounded border border-white/5">Ratio Cláusula/Var: <b class="text-white">1.250</b></div>
              <div class="p-2 bg-slate-900/60 rounded border border-white/5">Media Campos h: <b class="text-white">-2.65 eV</b></div>
              <div class="p-2 bg-slate-900/60 rounded border border-white/5">Varianza h: <b class="text-white">1.24 eV²</b></div>
              <div class="p-2 bg-slate-900/60 rounded border border-white/5">Media Acoplamientos J: <b class="text-white">3.04 eV</b></div>
              <div class="p-2 bg-slate-900/60 rounded border border-white/5">Varianza J: <b class="text-white">1.15 eV²</b></div>
              <div class="p-2 bg-slate-900/60 rounded border border-white/5">Min J: <b class="text-white">1.60 eV</b></div>
              <div class="p-2 bg-slate-900/60 rounded border border-white/5">Max J: <b class="text-white">4.80 eV</b></div>
              <div class="p-2 bg-slate-900/60 rounded border border-white/5">λ_signed Min: <b class="text-white">0.312 rad</b></div>
            </div>
          </div>
        </div>
      `;
    }

    // Etapa 4: PINN con animación activa en canvas
    function renderStage4() {
      stageViewport.innerHTML = `
        <div class="w-full h-full flex flex-col md:flex-row gap-4 font-mono">
          <div class="flex-1 bg-[#070b16] rounded-2xl border border-cyan-500/30 p-4 flex flex-col items-center justify-center relative">
            <div class="text-xs text-cyan-300 font-bold mb-2">Propagación Hacia Adelante (Feed-Forward Feed)</div>
            <canvas id="pinn-canvas" width="560" height="300" class="w-full max-w-xl"></canvas>
            <div class="text-[11px] text-emerald-400 mt-2">Pérdida Física PINN: ℒ = 0.0142 (Sin Barren Plateaus)</div>
          </div>
          <div class="w-full md:w-96 bg-[#070b16] rounded-2xl border border-amber-500/30 p-4 flex flex-col justify-between text-xs">
            <div>
              <div class="text-amber-300 font-bold mb-3">Hiperparámetros QAOA Predichos por la PINN</div>
              <div class="space-y-2">
                <div class="p-2 bg-slate-900 rounded border border-amber-500/30 flex justify-between">
                  <span>γ₁ (Costo Capa 1):</span>
                  <b class="text-amber-300">0.3927 rad (π/8)</b>
                </div>
                <div class="p-2 bg-slate-900 rounded border border-amber-500/30 flex justify-between">
                  <span>β₁ (Mixer Capa 1):</span>
                  <b class="text-amber-300">0.5236 rad (π/6)</b>
                </div>
                <div class="p-2 bg-slate-900 rounded border border-amber-500/30 flex justify-between">
                  <span>γ₂ (Costo Capa 2):</span>
                  <b class="text-amber-300">0.7854 rad (π/4)</b>
                </div>
                <div class="p-2 bg-slate-900 rounded border border-amber-500/30 flex justify-between">
                  <span>β₂ (Mixer Capa 2):</span>
                  <b class="text-amber-300">0.2618 rad (π/12)</b>
                </div>
              </div>
            </div>
            <div class="p-2 rounded bg-black/50 border border-white/5 text-[10px] text-slate-400">
              Inferencia O(1) basada en el Hamiltoniano: Ángulos Óptimos Garantizados
            </div>
          </div>
        </div>
      `;

      const canvas = document.getElementById('pinn-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const layers = [8, 14, 10, 4];
        let t = 0;

        function animPinn() {
          if (!document.getElementById('pinn-canvas')) return;
          requestAnimationFrame(animPinn);
          t += 0.02;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const w = canvas.width;
          const h = canvas.height;
          const layerGap = w / (layers.length + 0.5);
          const coords = [];

          layers.forEach((cnt, lIdx) => {
            const x = (lIdx + 0.8) * layerGap;
            const nodes = [];
            const gap = Math.min(26, (h - 40) / cnt);
            const startY = (h - (cnt - 1) * gap) / 2;
            for (let n = 0; n < cnt; n++) {
              nodes.push({ x, y: startY + n * gap });
            }
            coords.push(nodes);
          });

          // Sinapsis
          for (let l = 0; l < coords.length - 1; l++) {
            coords[l].forEach(f => {
              coords[l+1].forEach(tn => {
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);
                ctx.lineTo(tn.x, tn.y);
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
                ctx.stroke();
              });
            });
          }

          // Nodos
          coords.forEach((l, lIdx) => {
            l.forEach(n => {
              ctx.beginPath();
              ctx.arc(n.x, n.y, lIdx === 3 ? 7 : 5, 0, Math.PI * 2);
              ctx.fillStyle = lIdx === 3 ? '#ffea00' : (lIdx === 0 ? '#38bdf8' : '#00ff88');
              ctx.fill();
            });
          });
        }
        animPinn();
      }
    }

    // Etapa 5: Composer con construcción progresiva
    function renderStage5() {
      let step = 0;
      stageViewport.innerHTML = `
        <div class="w-full h-full bg-[#070b16] rounded-2xl border border-cyan-500/30 p-6 flex flex-col justify-center font-mono">
          <div class="flex justify-between items-center mb-4">
            <span class="text-xs text-cyan-300 font-bold">Construcción Progresiva del Circuito QAOA</span>
            <span id="composer-status" class="text-amber-400 text-xs font-semibold">Ensamblando compuertas...</span>
          </div>
          <div class="space-y-6">
            ${[0,1,2,3].map(q => `
              <div class="flex items-center gap-3">
                <div class="w-16 font-bold text-cyan-400 text-xs">|0⟩_q${q}</div>
                <div class="flex-1 flex items-center justify-around bg-slate-900/50 p-2 rounded-xl border border-white/5 relative h-12">
                  <div class="gate-slot w-8 h-8 rounded bg-sky-600/40 border border-sky-400 flex items-center justify-center font-bold text-xs text-white opacity-0 transition-all duration-300" data-col="1">H</div>
                  <div class="gate-slot w-10 h-8 rounded bg-purple-900/60 border border-purple-400 flex items-center justify-center font-bold text-[10px] text-purple-200 opacity-0 transition-all duration-300" data-col="2">R_ZZ</div>
                  <div class="gate-slot w-8 h-8 rounded bg-pink-900/50 border border-pink-400 flex items-center justify-center font-bold text-[10px] text-pink-200 opacity-0 transition-all duration-300" data-col="3">R_Z</div>
                  <div class="gate-slot w-8 h-8 rounded bg-amber-900/50 border border-amber-400 flex items-center justify-center font-bold text-[10px] text-amber-200 opacity-0 transition-all duration-300" data-col="4">R_X</div>
                  <div class="gate-slot w-10 h-8 rounded bg-purple-900/60 border border-purple-400 flex items-center justify-center font-bold text-[10px] text-purple-200 opacity-0 transition-all duration-300" data-col="5">R_ZZ</div>
                  <div class="gate-slot w-8 h-8 rounded bg-emerald-900/60 border border-emerald-400 flex items-center justify-center font-bold text-xs text-emerald-300 opacity-0 transition-all duration-300" data-col="6">M</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // Revelar progresivamente las compuertas
      let currentCol = 1;
      const interval = setInterval(() => {
        if (!document.getElementById('composer-status')) {
          clearInterval(interval);
          return;
        }
        document.querySelectorAll(`.gate-slot[data-col="${currentCol}"]`).forEach(el => {
          el.classList.remove('opacity-0');
          el.classList.add('opacity-100', 'scale-105');
        });
        currentCol++;
        if (currentCol > 6) {
          clearInterval(interval);
          const st = document.getElementById('composer-status');
          if (st) st.textContent = 'Circuito Ensamblado al 100%';
        }
      }, 700);
    }

    // Etapa 6: 3D Bar Chart Visualizer
    function renderStage6() {
      stageViewport.innerHTML = `
        <div class="w-full h-full flex flex-col md:flex-row gap-4 font-mono">
          <div id="three-bar-container" class="flex-1 bg-[#060913] rounded-2xl border border-cyan-500/30 min-h-[360px] relative overflow-hidden">
            <div class="absolute top-3 left-3 z-10 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-cyan-500/30 text-xs font-bold text-cyan-300">
              Visualización 3D por Disparos (1024 Shots)
            </div>
            <div class="absolute top-3 right-3 z-10 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-amber-400/40 text-xs font-bold text-amber-300">
              👑 Óptimo Ganador: |1010⟩
            </div>
            <div class="absolute bottom-3 left-3 z-10 text-[10px] text-slate-400 bg-black/60 px-2.5 py-1 rounded border border-white/5">
              🖱️ Arrastrar: Rotar cámara 3D • Rueda: Zoom
            </div>
          </div>
          <div class="w-full md:w-96 bg-[#070b16] rounded-2xl border border-amber-400 p-5 flex flex-col justify-between shadow-[0_0_25px_rgba(255,234,0,0.25)] text-xs">
            <div>
              <div class="text-center text-3xl mb-1">👑</div>
              <div class="text-center text-2xl font-bold text-white tracking-widest">|1010⟩</div>
              <div class="text-center text-amber-300 text-xs mt-1">Estado Fundamental Óptimo</div>
              <div class="p-3 bg-black/60 rounded-xl border border-white/10 my-4 space-y-1 text-slate-300">
                <div>x₁ (q₀) = 1</div>
                <div>x₂ (q₁) = 0</div>
                <div>x₃ (q₂) = 1</div>
                <div>x₄ (q₃) = 0</div>
              </div>
              <div class="p-2.5 rounded-xl bg-emerald-950/40 border border-emerald-500/40 text-emerald-300 flex justify-between font-bold">
                <span>Valor Objetivo Óptimo:</span> <span class="text-white">f(x*) = 11.0</span>
              </div>
            </div>
            <div class="text-center text-slate-400 text-[10px] mt-2">
              Validación Cuántica de Restricciones: 100% Factible
            </div>
          </div>
        </div>
      `;

      // Inicializar escena 3D de Three.js para las barras
      const container = document.getElementById('three-bar-container');
      if (container) {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060913);
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 6, 14);
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        // Plataforma
        const ground = new THREE.Mesh(new THREE.BoxGeometry(14, 0.1, 8), new THREE.MeshStandardMaterial({ color: 0x0a101d }));
        scene.add(ground);

        // 8 barras cuánticas
        const states = ["0000", "0010", "0101", "1000", "1001", "1010", "1100", "1111"];
        const heights = [0.8, 1.4, 4.8, 1.1, 2.2, 7.5, 1.8, 0.8]; // 1010 gana
        const barsGroup = new THREE.Group();
        scene.add(barsGroup);

        states.forEach((st, i) => {
          const isWinner = st === "1010";
          const h = heights[i];
          const x = (i - 3.5) * 1.5;
          const mat = new THREE.MeshStandardMaterial({
            color: isWinner ? 0xffea00 : 0x00ff88,
            emissive: isWinner ? 0xffd700 : 0x00ee55,
            emissiveIntensity: isWinner ? 1.5 : 0.8,
            transparent: true,
            opacity: 0.85
          });
          const geo = new THREE.BoxGeometry(1.0, h, 1.0);
          geo.translate(0, h/2, 0);
          const bar = new THREE.Mesh(geo, mat);
          bar.position.set(x, 0, 0);
          barsGroup.add(bar);

          // Texto en sprite
          const canvas = document.createElement('canvas');
          canvas.width = 128;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = isWinner ? '#ffea00' : '#00ff88';
          ctx.font = 'bold 24px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`|${st}⟩`, 64, 40);
          const spMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) });
          const sprite = new THREE.Sprite(spMat);
          sprite.position.set(x, h + 0.6, 0);
          sprite.scale.set(1.2, 0.6, 1);
          barsGroup.add(sprite);
        });

        function animBars() {
          if (!document.getElementById('three-bar-container')) return;
          requestAnimationFrame(animBars);
          barsGroup.rotation.y += 0.005;
          renderer.render(scene, camera);
        }
        animBars();
      }
    }

    btnToggle.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnToggle.textContent = isPlaying ? '⏸ Pausar' : '▶ Reanudar';
    });

    btnPrev.addEventListener('click', () => {
      currentStage = (currentStage - 1 + totalStages) % totalStages;
      renderStage();
    });

    btnNext.addEventListener('click', () => {
      currentStage = (currentStage + 1) % totalStages;
      renderStage();
    });

    btnRestart.addEventListener('click', () => {
      currentStage = 0;
      isPlaying = true;
      btnToggle.textContent = '⏸ Pausar';
      renderStage();
    });

    speedBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        speedBtns.forEach(b => b.classList.remove('bg-cyan-500/30', 'text-cyan-300'));
        btn.classList.add('bg-cyan-500/30', 'text-cyan-300');
        speed = parseFloat(btn.dataset.speed);
      });
    });

    // Iniciar
    renderStage();
  </script>
</body>
</html>
