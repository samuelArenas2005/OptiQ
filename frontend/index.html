<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Solver IDE - Hackathon</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Incluir Three.js desde un CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Panel del IDE (Lado Izquierdo) -->
        <div id="ide-panel">
            <div class="header">
                <h1>Quantum IDE</h1>
                <p>Escribe tu problema estilo MiniZinc</p>
            </div>
            
            <textarea id="code-editor" spellcheck="false">% Problema de la Mochila Binaria (Knapsack)
int: n = 4;
int: capacity = 7;
array[1..4] of int: weights = [2, 3, 4, 5];
array[1..4] of int: values  = [3, 4, 5, 8];

array[1..4] of var 0..1: x;

% Restriccion de capacidad de la mochila
constraint sum(i in 1..n)(weights[i] * x[i]) <= capacity;

% Funcion objetivo: maximizar el valor total recolectado
solve maximize sum(i in 1..n)(values[i] * x[i]);
</textarea>
            
            <div class="controls">
                <select id="solver-select">
                    <option value="qaoa-pinn">Quantum QAOA + PINN Hybrid</option>
                    <option value="classic">Classic Solver (Base)</option>
                </select>
                <button id="run-btn" class="btn primary">Run & Visualize 🚀</button>
            </div>
            
            <div id="status-panel">
                <h3>Estado:</h3>
                <p id="status-text">Esperando inicio...</p>
            </div>
        </div>
        
        <!-- Panel de Animación 3D (Lado Derecho) -->
        <div id="visualization-panel">
            <!-- Canvas será insertado por Three.js -->
        </div>
    </div>

    <!-- Scripts locales -->
    <script src="js/ide.js"></script>
    <script src="js/visualization.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
